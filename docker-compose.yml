# ---
# file: docker-compose.yml
# stack: django+channels+celery
# purpose: Local development services — all services containerised (Docker Rules)
# created-by: dev-team
# sprint: sprint-1
# story: US-1 AC-1.1
# ---
#
# Env values use ${VAR:-default} interpolation.

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A config beat -l info --pidfile=/tmp/celery-beat.pid
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
