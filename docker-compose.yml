# ---
# file: docker-compose.yml
# stack: django+channels+celery+listener+react+vite
# purpose: Local development services — all services containerised (Docker Rules)
# created-by: dev-team
# sprint: sprint-1
# story: US-1 AC-1.1, US-1 AC-1.4, US-16 AC-16.3, US-48 AC-48.1, US-59 AC-59.1
# last-updated: 2026-06-18
# ---
#
# Env values use ${VAR:-default} interpolation.

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    build: .
    command: celery -A config beat -l info --pidfile=/tmp/celery-beat.pid
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-beat.pid && kill -0 $(cat /tmp/celery-beat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  listener:
    build: .
    command: python manage.py run_listener
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  copytrade_engine:
    build: .
    command: python manage.py run_copytrade_engine
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/app}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_BACKEND_URL: http://web:8000
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
