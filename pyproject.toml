# ---
# file: pyproject.toml
# stack: django
# purpose: Ruff linter, pytest-django, and coverage configuration
# created-by: project-lead
# ---

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "tools"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings.py",
    # Standalone developer diagnostic CLI — a 1k-line soak harness validated by
    # its fixture test (test_v7_soak_us91.py) + real multi-day runs, NOT by line
    # coverage of its argparse/report boilerplate. Not on any live serving path.
    "scripts/v7_soak.py",
]
