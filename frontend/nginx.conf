# ---
# file: frontend/nginx.conf
# stack: react+vite
# purpose: nginx config for the production frontend container.
#   SPA fallback: all routes serve index.html so React Router handles client-side routing.
#   API and WebSocket traffic is handled by the 'web' (Django/Daphne) container.
# created-by: dev-team
# sprint: sprint-10
# story: US-48 AC-48.1
# last-updated: 2026-06-17
# ---

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unknown paths return index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the entry point so deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
