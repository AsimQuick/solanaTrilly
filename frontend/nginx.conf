# ---
# file: frontend/nginx.conf
# stack: react+vite
# purpose: nginx config for the production frontend container.
#   SPA fallback: all non-API routes serve index.html so React Router handles
#   client-side routing.
#   API and WebSocket traffic is reverse-proxied to the 'web' (Django/Daphne)
#   container over the solanatrilly_net docker network, so the operator only
#   needs the single frontend host port (8003) — the SPA's relative /api and
#   /ws calls are proxied here rather than requiring a second public origin.
# created-by: dev-team
# sprint: sprint-10
# story: US-48 AC-48.1
# last-updated: 2026-06-20  (US-76 dashboard fix: add /api+/ws+/health proxy, dual-stack listen)
# ---

server {
    # Dual-stack: nginx:alpine's entrypoint skips adding [::]:80 when a custom
    # default.conf is mounted, so declare it here. Without it a healthcheck that
    # resolves localhost->::1 gets connection-refused even though IPv4 serves fine.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with the $web variable in proxy_pass below,
    # this forces per-request resolution of the 'web' service — so nginx (a) does
    # not fail to start if web is briefly unresolvable, and (b) picks up web's new
    # container IP after every deploy (which recreates web) without an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API: reverse-proxy to the Django/Daphne web container ----------------
    # Host is preserved ($host = the browser's Host, which is in Django
    # ALLOWED_HOSTS); sending the upstream name (web) would 400 DisallowedHost.
    # proxy_pass has no URI part (http://$web only) so the full /api/... request
    # URI is passed through unchanged.
    location /api/ {
        set $web web:8000;
        proxy_pass http://$web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Health passthrough (so the operator can probe the API via this port) -
    location /health/ {
        set $web web:8000;
        proxy_pass http://$web;
        proxy_set_header Host $host;
    }

    # --- WebSocket: Django Channels realtime over /ws/ ------------------------
    location /ws/ {
        set $web web:8000;
        proxy_pass http://$web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — unknown paths return index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the entry point so deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
