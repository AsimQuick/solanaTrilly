# ---
# file: docker-compose.staging.yml
# stack: django+channels+listener+celery+react+vite
# purpose: VPS staging compose — the ONLY compose file run on the VPS (PRD §15.4).
#   Compose project: -p solanatrilly (enforced via top-level name: field AND CLI flag).
#   Isolation: distinct Postgres DB (solanatrilly), distinct volume (solanatrilly_pgdata),
#   distinct Redis, distinct Docker network (solanatrilly_net).
#   web on host port 8002 (solanaBilly owns 8001 — never touch it).
#   frontend: React+Vite SPA served by the ghcr.io/asimquick/solanatrilly-frontend image
#     (nginx serving pre-built static assets); no external port — traffic routed via
#     web container proxy or direct access; built from frontend/Dockerfile prod stage.
#   listener: dedicated detection/reconciler container — never shares the web/gunicorn
#     process (#289 lesson); runs python manage.py run_listener inside the GHCR image.
#   celery-worker: dedicated Feature Builder container — NEVER web/gunicorn (#289 lesson).
#   celery-beat: dedicated periodic scheduler container.
#   VPS is never hand-edited: deploy.yml pulls the GHCR image and brings up this file.
# created-by: dev-team
# sprint: sprint-7
# story: US-6 AC-6.2, US-16 AC-16.3, US-31 AC-31.1, US-48 AC-48.1, US-59 AC-59.1
# last-updated: 2026-06-18
# ---
#
# Hard isolation rules:
#   - ALL docker commands on the VPS MUST be scoped: docker compose -p solanatrilly ...
#   - NEVER run unscoped: docker down / up --force-recreate / prune / volume removal
#   - solanaBilly lives at /root/solanaBilly on port 8001 — NEVER TOUCH IT

name: solanatrilly

networks:
  solanatrilly_net:
    driver: bridge

volumes:
  solanatrilly_pgdata:

services:
  web:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    # Model artifacts (boosters + meta.json) live on the host and are mounted
    # read-only so promote_blend (here) and the BlendScorer (celery-worker) read
    # the SAME files from a stable, deploy-surviving path. Host dir is populated
    # by the operator cutover (scp). solanaBilly untouched (scoped path).
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    ports:
      - "8002:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solanatrilly
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - solanatrilly_pgdata:/var/lib/postgresql/data
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  listener:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: python manage.py run_listener
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped

  copytrade_engine:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: python manage.py run_copytrade_engine
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: celery -A config worker -l info
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: celery -A config beat -l info --pidfile=/tmp/celery-beat.pid
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-beat.pid && kill -0 $(cat /tmp/celery-beat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/asimquick/solanatrilly-frontend:latest
    # Operator-facing dashboard origin. nginx serves the built SPA and reverse-
    # proxies /api + /ws to the web container, so the operator only needs 8003.
    # (8001 = solanaBilly, 8002 = this stack's web/API — both stay untouched.)
    ports:
      - "8003:80"
    depends_on:
      - web
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost): nginx listens IPv4+IPv6, but pinning to IPv4
      # avoids a ::1-resolution false-negative on hosts where localhost->::1.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
