# ---
# file: docker-compose.staging.yml
# stack: django+channels+listener+celery+react+vite
# purpose: VPS staging compose — the ONLY compose file run on the VPS (PRD §15.4).
#   Compose project: -p solanatrilly (enforced via top-level name: field AND CLI flag).
#   Isolation: distinct Postgres DB (solanatrilly), distinct volume (solanatrilly_pgdata),
#   distinct Redis, distinct Docker network (solanatrilly_net).
#   web on host port 8002 (solanaBilly owns 8001 — never touch it).
#   frontend: React+Vite SPA served by the ghcr.io/asimquick/solanatrilly-frontend image
#     (nginx serving pre-built static assets); no external port — traffic routed via
#     web container proxy or direct access; built from frontend/Dockerfile prod stage.
#   listener: dedicated detection/reconciler container — never shares the web/gunicorn
#     process (#289 lesson); runs python manage.py run_listener inside the GHCR image.
#   celery-worker: dedicated Feature Builder container — NEVER web/gunicorn (#289 lesson).
#   celery-beat: dedicated periodic scheduler container.
#   VPS is never hand-edited: deploy.yml pulls the GHCR image and brings up this file.
# created-by: dev-team
# sprint: sprint-15
# story: US-6 AC-6.2, US-16 AC-16.3, US-31 AC-31.1, US-48 AC-48.1, US-59 AC-59.1,
#        US-96 (shared firehose: /root/tape :ro mount + TAPE_SOURCE + drop HELIUS from inference_engine)
# last-updated: 2026-06-26
# ---
#
# Hard isolation rules:
#   - ALL docker commands on the VPS MUST be scoped: docker compose -p solanatrilly ...
#   - NEVER run unscoped: docker down / up --force-recreate / prune / volume removal
#   - solanaBilly lives at /root/solanaBilly on port 8001 — NEVER TOUCH IT

name: solanatrilly

networks:
  solanatrilly_net:
    driver: bridge

volumes:
  solanatrilly_pgdata:
  # Dedicated durable firehose-tape lake (AC-3): inference_engine WRITES the live
  # tape here and celery-worker (US-78 swaps export) READS it. Mounted at
  # /app/lake/firehose — SEPARATE from the dashboard's /app/lake/tapes so the
  # candle/cohort/token-detail APIs (which scan their whole lake per request) are
  # NOT slowed by the high-volume live torrent. web does NOT mount this.
  solanatrilly_lake:

services:
  web:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    # Model artifacts (boosters + meta.json) live on the host and are mounted
    # read-only so promote_blend (here) and the BlendScorer (celery-worker) read
    # the SAME files from a stable, deploy-surviving path. Host dir is populated
    # by the operator cutover (scp). solanaBilly untouched (scoped path).
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    ports:
      - "8002:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solanatrilly
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - solanatrilly_pgdata:/var/lib/postgresql/data
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - solanatrilly_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  listener:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: python manage.py run_listener
    volumes:
      - /root/solanatrilly/models:/app/models:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped

  copytrade_engine:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: python manage.py run_copytrade_engine
    volumes:
      - /root/solanatrilly/models:/app/models:ro
      # EPIC-copy-paper-fill-repricing showstopper fix: mount the firehose lake
      # so the reprice_copy_fill Celery task (dispatched from close_position) can
      # read lake rows.  The settler runs on celery-worker (which already mounts it);
      # copytrade_engine dispatches .delay() — the task body runs on celery-worker,
      # NOT copytrade_engine.  Mount is defensive: if any future code path directly
      # reads the lake from copytrade_engine, it will find the volume here.
      - solanatrilly_lake:/app/lake/firehose
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      # REQUIRED for exit evaluation: copytrade.price_source.fetch_mint_price_usd
      # calls Birdeye /defi/price; without this key it returns None for EVERY mint,
      # so the manager loop skips every position and NOTHING settles (the 15h-stuck
      # bug). Was missing here while listener/inference_engine had it.
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      # Live-trading wallet + RPC (US-80). Read ONLY when the operator sets
      # trading_enabled=True; inert in observe/paper. Secret lives in the VPS .env.
      TRADING_WALLET_KEY: ${TRADING_WALLET_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped

  # Persistent, GATED inference engine (US-79 / US-96). Runs run_firehose unbounded;
  # while PipelineState.firehose_active is False it idles (no subscriptions, no spend).
  # US-96 SHARED FIREHOSE: reads solanaBilly's tape READ-ONLY from /root/tape (schema A);
  # does NOT open its own Helius subscription; does NOT write a self-tape.
  # HELIUS_API_KEY intentionally absent here (US-96 §5e): inference_engine no longer
  # needs it for tape collection. listener / celery-worker / copytrade_engine retain it
  # for detection/settler/price lookups.
  # Rollback: set TAPE_SOURCE=self and re-add HELIUS_API_KEY to restore self-firehose.
  inference_engine:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: python manage.py run_firehose -v 2
    volumes:
      - /root/solanatrilly/models:/app/models:ro
      - solanatrilly_lake:/app/lake/firehose
      # US-96: solanaBilly's shared firehose tape (schema A, read-only).
      # billy writes /root/tape; we mount it at a DISTINCT path so the source
      # is unambiguous and we can never mutate billy's lake.
      - /root/tape:/app/lake/billy_tape:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-140.82.43.36,localhost,127.0.0.1}
      REDIS_URL: redis://redis:6379/0
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      # US-96: default shared_billy; set self for self-firehose fallback escape hatch.
      TAPE_SOURCE: ${TAPE_SOURCE:-shared_billy}
      # HELIUS_API_KEY is intentionally ABSENT from inference_engine (US-96 §5e):
      # under TAPE_SOURCE=shared_billy inference_engine does not open Helius.
      # Live-trading wallet + RPC (US-80). Read ONLY when trading_enabled=True;
      # inert in observe/paper. Secret lives in the VPS .env (gitignored).
      TRADING_WALLET_KEY: ${TRADING_WALLET_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: celery -A config worker -l info
    volumes:
      - /root/solanatrilly/models:/app/models:ro
      - solanatrilly_lake:/app/lake/firehose
      # US-96: read-only access to solanaBilly's shared tape for the curvestage
      # settler and US-78 swaps export (schema-A normalisation).
      - /root/tape:/app/lake/billy_tape:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      REDIS_URL: redis://redis:6379/0
      # The curvestage settler (copytrade.tasks.settle_curvestage_positions) runs
      # HERE and fetches the post-grad tape from Birdeye to reconstruct honest PnL.
      # Without the key it returns empty -> NOTHING settles -> zero copy PnL.
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      # US-96: default shared_billy (allows future settler/export reads from billy_tape).
      TAPE_SOURCE: ${TAPE_SOURCE:-shared_billy}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping 2>&1 | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    image: ghcr.io/asimquick/solanatrilly:latest
    command: celery -A config beat -l info --pidfile=/tmp/celery-beat.pid
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/solanatrilly
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: 0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-beat.pid && kill -0 $(cat /tmp/celery-beat.pid) 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/asimquick/solanatrilly-frontend:latest
    # Operator-facing dashboard origin. nginx serves the built SPA and reverse-
    # proxies /api + /ws to the web container, so the operator only needs 8003.
    # (8001 = solanaBilly, 8002 = this stack's web/API — both stay untouched.)
    ports:
      - "8003:80"
    depends_on:
      - web
    networks:
      - solanatrilly_net
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost): nginx listens IPv4+IPv6, but pinning to IPv4
      # avoids a ::1-resolution false-negative on hosts where localhost->::1.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
