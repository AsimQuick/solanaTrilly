# ---
# file: ci.yml
# stack: django
# purpose: GitHub Actions CI — lint and test inside Docker
# created-by: project-lead
# ---
#
# Job name is "test" to match the required status check set by branch protection.

name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore:
      - 'scrum-master/**'
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Auto-promote stale sprint phases (US-33 AC-33.1)
        run: python3 tools/promote_sprint_phase.py scrum-master/sprint*.json

      - name: Sprint integrity check (US-13 AC-13.3)
        run: python3 tools/sprint_integrity_check.py --skip-complete scrum-master/sprint*.json

      - name: Build containers
        run: docker compose build

      - name: Lint
        run: docker compose run --rm web ruff check .

      - name: Run tests with coverage
        run: docker compose run --rm web pytest --cov=. --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=80 --tb=short -q

      - name: Teardown
        if: always()
        run: docker compose down -v
