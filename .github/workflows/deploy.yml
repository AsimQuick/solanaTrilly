# ---
# file: deploy.yml
# stack: django
# purpose: CD pipeline — on push to main runs hardened CI then builds and pushes web image to GHCR
# sprint: sprint-2
# story: US-6 AC-6.1
# created-by: dev-team
# last-updated: 2026-06-15
# ---
#
# Uses the built-in GITHUB_TOKEN with packages:write — no extra secrets required.
# All action refs are pinned to full 40-char commit SHAs (H1 / AC-3.1).

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scrum-master/**'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          push: true
          tags: |
            ghcr.io/asimquick/solanatrilly:latest
            ghcr.io/asimquick/solanatrilly:${{ github.sha }}
