# ---
# file: deploy.yml
# stack: django
# purpose: CD pipeline — triggers on push to main and on manual dispatch; runs hardened CI,
#          builds/pushes web image to GHCR, then deploys to the VPS staging stack
#          (-p solanatrilly, port 8002) and smoke-tests it.
# sprint: sprint-4, sprint-10, sprint-11
# story: US-6 AC-6.1 AC-6.3 AC-6.4 AC-6.5 US-8 AC-8.1 AC-8.2 AC-8.4 AC-8.5 US-12 AC-12.3 AC-12.4 AC-12.5 US-33 AC-33.3 US-39 AC-39.2 AC-39.3 US-45 AC-45.2 US-46 AC-46.2 US-48 AC-48.3 US-52 AC-52.1 AC-52.3 US-53 AC-53.2 AC-53.3 US-54 AC-54.1 AC-54.3 US-55 AC-55.1 AC-55.2 AC-55.3
# created-by: dev-team
# last-updated: 2026-06-18
# ac-54.3-note: tester_confirm_ac543.md documents the reproducibility confirmation artifact
# ac-53.2-fix: docker image prune -f before docker compose pull to prevent ENOSPC on VPS
# ---
#
# GHCR auth uses the built-in GITHUB_TOKEN with packages:write — no extra secrets required.
# VPS deploy (AC-6.3) uses VPS_SSH_KEY, VPS_USER, VPS_HOST repo secrets.
# All action refs are pinned to full 40-char commit SHAs (H1 / AC-3.1).
# Every docker compose command is scoped: -p solanatrilly (PRD §15.3, hard isolation).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          push: true
          tags: |
            ghcr.io/asimquick/solanatrilly:latest
            ghcr.io/asimquick/solanatrilly:${{ github.sha }}

      - name: Build and push frontend image (AC-48.3)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: frontend
          file: frontend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/asimquick/solanatrilly-frontend:latest
            ghcr.io/asimquick/solanatrilly-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Phase-promoter pre-deploy gate (AC-39.2)
        run: python3 tools/promote_sprint_phase.py scrum-master/sprint*.json

      - name: Deploy to VPS staging stack
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'mkdir -p /root/solanatrilly'
          scp -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            docker-compose.staging.yml \
            "${VPS_USER}@${VPS_HOST}:/root/solanatrilly/docker-compose.staging.yml"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker image prune -f; docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml down --remove-orphans; docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml pull && docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml up -d --remove-orphans'
          rm -f /tmp/deploy_key

      - name: Smoke-test staging stack (AC-6.4 / AC-12.3)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SMOKE_MAX_ATTEMPTS=12
          SMOKE_RETRY_DELAY=5
          echo "Smoke-testing solanatrilly staging stack at http://${VPS_HOST}:8002/health/"
          echo "Backoff config: max_attempts=${SMOKE_MAX_ATTEMPTS} retry_delay=${SMOKE_RETRY_DELAY}s"
          for i in $(seq 1 "${SMOKE_MAX_ATTEMPTS}"); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/health/" || true)
            if [ "$status" = "200" ]; then
              echo "Smoke test PASSED on attempt ${i}/${SMOKE_MAX_ATTEMPTS}: GET /health/ returned HTTP 200"
              exit 0
            fi
            echo "Attempt ${i}/${SMOKE_MAX_ATTEMPTS}: HTTP ${status} — retrying in ${SMOKE_RETRY_DELAY}s"
            sleep "${SMOKE_RETRY_DELAY}"
          done
          echo "Smoke test FAILED: /health/ did not return HTTP 200 after all ${SMOKE_MAX_ATTEMPTS} attempts (${SMOKE_MAX_ATTEMPTS} x ${SMOKE_RETRY_DELAY}s)"
          exit 1

      - name: Smoke-test dashboard route HTTP 200 (AC-48.3)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-48.3 — verifying dashboard route returns HTTP 200 at http://${VPS_HOST}:8002/dashboard/"
          SMOKE_MAX_ATTEMPTS=6
          SMOKE_RETRY_DELAY=5
          for i in $(seq 1 "${SMOKE_MAX_ATTEMPTS}"); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/dashboard/" || true)
            if [ "$status" = "200" ]; then
              echo "Dashboard route PASS on attempt ${i}: GET /dashboard/ returned HTTP 200"
              exit 0
            fi
            echo "Attempt ${i}/${SMOKE_MAX_ATTEMPTS}: HTTP ${status} — retrying in ${SMOKE_RETRY_DELAY}s"
            sleep "${SMOKE_RETRY_DELAY}"
          done
          echo "Dashboard route FAILED: /dashboard/ did not return HTTP 200 after ${SMOKE_MAX_ATTEMPTS} attempts"
          exit 1

      - name: Smoke-test WS endpoint HTTP 101 upgrade (AC-48.3)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-48.3 — verifying WebSocket endpoint accepts upgrade (HTTP 101) at ws://${VPS_HOST}:8002/ws/tape/smoke_test/"
          python3 - <<'PYEOF'
          import os, socket, base64, sys, time
          host = os.environ["VPS_HOST"]
          port = 8002
          path = "/ws/tape/smoke_test/"
          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              f"GET {path} HTTP/1.1\r\n"
              f"Host: {host}:{port}\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "\r\n"
          )
          max_attempts = 6
          for attempt in range(1, max_attempts + 1):
              try:
                  s = socket.create_connection((host, port), timeout=10)
                  s.sendall(request.encode())
                  time.sleep(0.5)
                  response = s.recv(1024).decode("utf-8", errors="replace")
                  s.close()
                  if "101" in response:
                      print(f"WS upgrade PASS on attempt {attempt}: HTTP 101 Switching Protocols")
                      sys.exit(0)
                  else:
                      print(f"Attempt {attempt}/{max_attempts}: unexpected response: {response[:120]}")
              except Exception as exc:
                  print(f"Attempt {attempt}/{max_attempts}: connection error: {exc}")
              if attempt < max_attempts:
                  time.sleep(5)
          print(f"WS upgrade FAILED after {max_attempts} attempts")
          sys.exit(1)
          PYEOF

      - name: Smoke-test US-49 candle API (AC-55.2)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-55.2 — verifying US-49 candle API responds at http://${VPS_HOST}:8002/api/candles/smoke_test/?interval_s=60"
          SMOKE_MAX_ATTEMPTS=6
          SMOKE_RETRY_DELAY=5
          for i in $(seq 1 "${SMOKE_MAX_ATTEMPTS}"); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/api/candles/smoke_test/?interval_s=60" || true)
            if [ "$status" = "200" ]; then
              echo "US-49 candle API PASS on attempt ${i}: GET /api/candles/smoke_test/?interval_s=60 returned HTTP 200"
              exit 0
            fi
            echo "Attempt ${i}/${SMOKE_MAX_ATTEMPTS}: HTTP ${status} — retrying in ${SMOKE_RETRY_DELAY}s"
            sleep "${SMOKE_RETRY_DELAY}"
          done
          echo "US-49 candle API FAILED: /api/candles/smoke_test/?interval_s=60 did not return HTTP 200 after ${SMOKE_MAX_ATTEMPTS} attempts"
          exit 1

      - name: Smoke-test US-50 cohort wall API (AC-55.2)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-55.2 — verifying US-50 cohort wall API responds at http://${VPS_HOST}:8002/api/cohort/?interval_s=60"
          SMOKE_MAX_ATTEMPTS=6
          SMOKE_RETRY_DELAY=5
          for i in $(seq 1 "${SMOKE_MAX_ATTEMPTS}"); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/api/cohort/?interval_s=60" || true)
            if [ "$status" = "200" ]; then
              echo "US-50 cohort wall API PASS on attempt ${i}: GET /api/cohort/?interval_s=60 returned HTTP 200"
              exit 0
            fi
            echo "Attempt ${i}/${SMOKE_MAX_ATTEMPTS}: HTTP ${status} — retrying in ${SMOKE_RETRY_DELAY}s"
            sleep "${SMOKE_RETRY_DELAY}"
          done
          echo "US-50 cohort wall API FAILED: /api/cohort/?interval_s=60 did not return HTTP 200 after ${SMOKE_MAX_ATTEMPTS} attempts"
          exit 1

      - name: Smoke-test US-51 annotation list API (AC-55.2)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-55.2 — verifying US-51 annotation list API responds at http://${VPS_HOST}:8002/api/annotations/smoke_test/"
          SMOKE_MAX_ATTEMPTS=6
          SMOKE_RETRY_DELAY=5
          for i in $(seq 1 "${SMOKE_MAX_ATTEMPTS}"); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/api/annotations/smoke_test/" || true)
            if [ "$status" = "200" ]; then
              echo "US-51 annotation list API PASS on attempt ${i}: GET /api/annotations/smoke_test/ returned HTTP 200"
              exit 0
            fi
            echo "Attempt ${i}/${SMOKE_MAX_ATTEMPTS}: HTTP ${status} — retrying in ${SMOKE_RETRY_DELAY}s"
            sleep "${SMOKE_RETRY_DELAY}"
          done
          echo "US-51 annotation list API FAILED: /api/annotations/smoke_test/ did not return HTTP 200 after ${SMOKE_MAX_ATTEMPTS} attempts"
          exit 1

      - name: Verify frontend and web containers Up (AC-48.3)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-48.3 — verifying 'frontend' and 'web' containers are Up in the solanatrilly stack"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ps_out=$(ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml ps 2>&1')
          echo "$ps_out"
          rm -f /tmp/deploy_key
          if ! echo "$ps_out" | grep -iE '^solanatrilly.web' | grep -qiE 'running|up'; then
            echo "AC-48.3 FAIL: 'web' container is NOT in running/up state"
            exit 1
          fi
          echo "AC-48.3 PASS: 'web' container is Up"
          if ! echo "$ps_out" | grep -iE '^solanatrilly.frontend' | grep -qiE 'running|up'; then
            echo "AC-48.3 FAIL: 'frontend' container is NOT in running/up state"
            exit 1
          fi
          echo "AC-48.3 PASS: 'frontend' container is Up"

      - name: Verify listener container Up (AC-33.3)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-33.3 — verifying 'listener' container is Up in the solanatrilly stack"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ps_out=$(ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml ps 2>&1')
          echo "$ps_out"
          rm -f /tmp/deploy_key
          if ! echo "$ps_out" | grep -iE '^solanatrilly.listener' | grep -qiE 'running|up'; then
            echo "AC-33.3 FAIL: 'listener' container is NOT in running/up state"
            exit 1
          fi
          echo "AC-33.3 PASS: 'listener' container is Up"

      - name: Verify celery-worker container Up (AC-53.3)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-53.3 — verifying 'celery-worker' container is Up in the solanatrilly stack"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ps_out=$(ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml ps 2>&1')
          echo "$ps_out"
          rm -f /tmp/deploy_key
          if ! echo "$ps_out" | grep -iE '^solanatrilly.celery.worker' | grep -qiE 'running|up'; then
            echo "AC-53.3 FAIL: 'celery-worker' container is NOT in running/up state"
            exit 1
          fi
          echo "AC-53.3 PASS: 'celery-worker' container is Up"

      - name: Verify solanaBilly isolation (AC-6.5 / AC-12.4)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-6.5 — verifying hard isolation: solanaBilly must be untouched after solanatrilly deploy"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Checking solanaBilly container status on VPS"
          ps_out=$(ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanabilly ps 2>&1')
          echo "$ps_out"
          if ! echo "$ps_out" | grep -qiE 'running|up'; then
            echo "ISOLATION FAILURE: solanaBilly containers NOT in running/up state after solanatrilly deploy"
            rm -f /tmp/deploy_key
            exit 1
          fi
          echo "solanaBilly containers still running — isolation preserved"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${VPS_HOST}:8001/" || true)
          echo "Port 8001 HTTP status: $status"
          if [ -z "$status" ] || [ "$status" = "000" ]; then
            echo "ISOLATION FAILURE: port 8001 did not respond after solanatrilly deployment"
            rm -f /tmp/deploy_key
            exit 1
          fi
          echo "Port 8001 still responds (HTTP $status) — AC-6.5 isolation check PASS"
          rm -f /tmp/deploy_key
