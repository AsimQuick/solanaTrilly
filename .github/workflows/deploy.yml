# ---
# file: deploy.yml
# stack: django
# purpose: CD pipeline — on push to main runs hardened CI, builds/pushes web image to GHCR,
#          then deploys to VPS staging stack (-p solanatrilly, port 8002) and smoke-tests it
# sprint: sprint-3
# story: US-6 AC-6.1 AC-6.3 AC-6.4 AC-6.5 US-8 AC-8.1 AC-8.2
# created-by: dev-team
# last-updated: 2026-06-15
# ---
#
# GHCR auth uses the built-in GITHUB_TOKEN with packages:write — no extra secrets required.
# VPS deploy (AC-6.3) uses VPS_SSH_KEY, VPS_USER, VPS_HOST repo secrets.
# All action refs are pinned to full 40-char commit SHAs (H1 / AC-3.1).
# Every docker compose command is scoped: -p solanatrilly (PRD §15.3, hard isolation).

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scrum-master/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          push: true
          tags: |
            ghcr.io/asimquick/solanatrilly:latest
            ghcr.io/asimquick/solanatrilly:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Deploy to VPS staging stack
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'mkdir -p /root/solanatrilly'
          scp -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            docker-compose.staging.yml \
            "${VPS_USER}@${VPS_HOST}:/root/solanatrilly/docker-compose.staging.yml"
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml pull && docker compose -p solanatrilly -f /root/solanatrilly/docker-compose.staging.yml up -d'
          rm -f /tmp/deploy_key

      - name: Smoke-test staging stack (AC-6.4)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Smoke-testing solanatrilly staging stack at http://${VPS_HOST}:8002/health/"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://${VPS_HOST}:8002/health/")
            if [ "$status" = "200" ]; then
              echo "Smoke test PASSED: GET /health/ returned HTTP 200"
              exit 0
            fi
            echo "Attempt $i/12: HTTP $status — retrying in 5s"
            sleep 5
          done
          echo "Smoke test FAILED: /health/ did not return HTTP 200 after 60 seconds"
          exit 1

      - name: Verify solanaBilly isolation (AC-6.5)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "AC-6.5 — verifying hard isolation: solanaBilly must be untouched after solanatrilly deploy"
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Checking solanaBilly container status on VPS"
          ps_out=$(ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /tmp/deploy_key \
            "${VPS_USER}@${VPS_HOST}" \
            'docker compose -p solanabilly ps 2>&1')
          echo "$ps_out"
          if ! echo "$ps_out" | grep -qiE 'running|up'; then
            echo "ISOLATION FAILURE: solanaBilly containers NOT in running/up state after solanatrilly deploy"
            rm -f /tmp/deploy_key
            exit 1
          fi
          echo "solanaBilly containers still running — isolation preserved"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${VPS_HOST}:8001/")
          echo "Port 8001 HTTP status: $status"
          if [ -z "$status" ] || [ "$status" = "000" ]; then
            echo "ISOLATION FAILURE: port 8001 did not respond after solanatrilly deployment"
            rm -f /tmp/deploy_key
            exit 1
          fi
          echo "Port 8001 still responds (HTTP $status) — AC-6.5 isolation check PASS"
          rm -f /tmp/deploy_key
